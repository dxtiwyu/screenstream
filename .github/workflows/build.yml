name: Build & Sign APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358"

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      # ── FDroid Debug (uses checked-in debug-key.jks, no secrets needed) ──
      - name: Build FDroid Debug APK
        run: ./gradlew :app:assembleFDroidDebug --no-daemon

      # ── Release signing (optional – only runs when secrets are set) ──
      - name: Decode release keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release-key.jks

      - name: Build FDroid Release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleFDroidRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$(pwd)/release-key.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # ── Collect all APKs ──
      - name: Find built APKs
        run: find app/build/outputs/apk -name "*.apk" | sort

      - name: Upload FDroid Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenStream-FDroid-Debug
          path: app/build/outputs/apk/FDroid/debug/*.apk
          if-no-files-found: error

      - name: Upload FDroid Release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        uses: actions/upload-artifact@v4
        with:
          name: ScreenStream-FDroid-Release-Signed
          path: app/build/outputs/apk/FDroid/release/*.apk
          if-no-files-found: warn
